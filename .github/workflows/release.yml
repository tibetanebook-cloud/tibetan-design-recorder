# Builds the installers on GitHub's machines.
# Windows and Mac only (owner decision 2026-10-23): three files per release,
#   Nangchen-Recorder-<v>-Windows-Setup.exe, -Mac-AppleSilicon.dmg, -Mac-Intel.dmg.
#   - Push a tag like v0.2.0  -> builds everything and attaches it to a DRAFT release
#     (nothing is public until you press "Publish release" on GitHub).
#   - Actions tab -> "Build installers" -> Run workflow -> builds and keeps the files as
#     downloadable artifacts for 14 days (no release).
# macOS releases are signed with Developer ID and notarized; Windows remains unsigned.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-14 # Apple Silicon runner; also builds the Intel (x64) app
            dist: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Tibetan UI audit (every screen in Tibetan, real app)
        if: runner.os == 'Windows'
        run: npm run smoke:l10n

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build signed and notarized Mac installers
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Mac signing credential: $name"
              exit 1
            fi
          done
          npm run dist:mac

      - name: Verify Mac signatures and notarization tickets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            count=$((count + 1))
          done < <(find dist -maxdepth 2 -type d -name '*.app' -print0)
          if [[ "$count" -ne 2 ]]; then
            echo "::error::Expected signed Apple Silicon and Intel app bundles; found $count"
            exit 1
          fi

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          retention-days: 14
          path: |
            dist/*-Windows-Setup.exe
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Plain names for the two Mac files
        run: |
          cd installers
          for f in *-Mac-arm64.dmg; do mv "$f" "${f%-arm64.dmg}-AppleSilicon.dmg"; done
          for f in *-Mac-x64.dmg; do mv "$f" "${f%-x64.dmg}-Intel.dmg"; done
          ls -la

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Nangchen T. Studio Screen Recorder ${{ github.ref_name }}
          body: |
            **Windows:** Nangchen-Recorder-…-Windows-Setup.exe
            **Mac (M1/M2/M3/M4):** …-Mac-AppleSilicon.dmg · **Mac (Intel):** …-Mac-Intel.dmg
            Mac builds are Developer ID signed and notarized. Windows builds remain unsigned (see docs/INSTALL.md).
          files: installers/*
