# Builds the installers on GitHub's machines.
#   - Push a tag like v0.2.0  -> builds everything and attaches it to a DRAFT release
#     (nothing is public until you press "Publish release" on GitHub).
#   - Actions tab -> "Build installers" -> Run workflow -> builds and keeps the files as
#     downloadable artifacts for 14 days (no release).
# Unsigned builds (owner decision 2026-10-22); signing secrets can be added later, see docs/BUILD.md.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-14 # Apple Silicon runner; also builds the Intel (x64) app
            dist: dist:mac
          - os: ubuntu-24.04
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Tibetan UI audit (every screen in Tibetan, real app)
        if: runner.os == 'Windows'
        run: npm run smoke:l10n

      - name: Build installers
        run: npm run ${{ matrix.dist }}
        env:
          # Unsigned: stop electron-builder from looking for signing identities.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build Windows ARM64 installer
        if: runner.os == 'Windows'
        run: npm run dist:win-arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Checksums
        run: cd installers && sha256sum * > SHA256SUMS.txt

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Nangchen T. Studio Screen Recorder ${{ github.ref_name }}
          body: |
            Installers for Windows, macOS and Linux. See INSTALL notes in the repository (docs/INSTALL.md):
            these builds are not code-signed yet, so Windows and macOS ask you to confirm the first start.
          files: installers/*
