# Builds the installers on GitHub's machines.
# Windows and Mac only (owner decision 2026-10-23): three files per release,
#   Nangchen-Recorder-<v>-Windows-Setup.exe, -Mac-AppleSilicon.dmg, -Mac-Intel.dmg.
#   - Push a tag like v0.2.0  -> builds everything and attaches it to a DRAFT release
#     (nothing is public until you press "Publish release" on GitHub).
#   - Actions tab -> "Build installers" -> Run workflow -> builds and keeps the files as
#     downloadable artifacts for 14 days (no release).
# Windows is unsigned for now. Mac builds are signed and notarized once the Apple secrets are
# set (see docs/BUILD.md); without them they get an ad-hoc signature, for testing only.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-14 # Apple Silicon runner; also builds the Intel (x64) app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Signing and notarizing need the certificate and the Apple account together.
      MAC_SIGNED: ${{ (secrets.MAC_CSC_LINK != '' || secrets.BUILD_CERTIFICATE_BASE64 != '') && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Tibetan UI audit (every screen in Tibetan, real app)
        if: runner.os == 'Windows'
        run: npm run smoke:l10n

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          # Unsigned: stop electron-builder from looking for signing identities.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build Mac installers (Developer ID, notarized)
        if: runner.os == 'macOS' && env.MAC_SIGNED == 'true'
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK || secrets.BUILD_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Mac installers (ad-hoc signature, for testing only)
        if: runner.os == 'macOS' && env.MAC_SIGNED != 'true'
        run: |
          echo "::warning::Apple certificate or account secrets are missing: this Mac build is ad-hoc signed and not notarized."
          npm run dist:mac -- -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false

      - name: Check the Mac apps (signature, and that the app stays running)
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/*.app; do
            echo "Checking $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            if [ "$MAC_SIGNED" = "true" ]; then
              spctl --assess --type execute --verbose=2 "$app"
              xcrun stapler validate "$app"
            fi
          done
          app=$(ls -d dist/mac-arm64/*.app | head -1)
          name=$(basename "$app" .app)
          "$app/Contents/MacOS/$name" &
          pid=$!
          sleep 20
          kill -0 "$pid"
          kill "$pid"

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          retention-days: 14
          path: |
            dist/*-Windows-Setup.exe
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Plain names for the two Mac files
        run: |
          cd installers
          for f in *-Mac-arm64.dmg; do mv "$f" "${f%-arm64.dmg}-AppleSilicon.dmg"; done
          for f in *-Mac-x64.dmg; do mv "$f" "${f%-x64.dmg}-Intel.dmg"; done
          ls -la

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Nangchen T. Studio Screen Recorder ${{ github.ref_name }}
          body: |
            **Windows:** Nangchen-Recorder-…-Windows-Setup.exe
            **Mac (M1/M2/M3/M4):** …-Mac-AppleSilicon.dmg · **Mac (Intel):** …-Mac-Intel.dmg
            These builds are not code-signed yet, so Windows and macOS ask you to confirm the first start (see docs/INSTALL.md).
          files: installers/*
